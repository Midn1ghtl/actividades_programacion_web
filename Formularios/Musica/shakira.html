<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />


    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <header style="background-color:rgb(70, 4, 88); color:white; text-align:center; padding:10px;">
            <h1>Reservación de entradas</h1>
        </header>
        <main align="center"><br>
            <section id="registro">
                <img src="visuales/shakira.jpg" alt="Concierto de Shakira" width="300" height="300"><br><br>
                
                <form action="/registro.html" method="get" class="signup">
                    <label for="fname"> Nombre: </label><br>
                    <input type="text" id="fname" name="fname" required/><br><br>

                    <label for="lname"> Apellido: </label><br>
                    <input type="text" id="lname" name="lname" required/><br><br>

                    <label for="numdui"> Documento Único de Identidad: (SIN guion)</label><br>
                    <input type="text" id="numdui" name="numdui" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" required/><br><br>

                    <label for="fecha"> Fecha: </label><br><br>
                    <input type="date" id="fecha" name="fecha" min="2026-08-10" max="2026-08-13" required/><br><br>
                    
                    <label for="asiento">Asiento: </label><br>
                    <input type="number" id="asiento" name="asiento" min="1" max="6" required/><br><br>

                    <input type="submit" value="Submit"><br><br>

                    <video width="320" height="240" controls>
                        <source src="concierto.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video><br>


                </form>

            </section>

            <nav>
                <a href="Menu.html">Regresar al menú</a>
            </nav>
        </main>
        <footer style="background-color:rgb(70, 4, 88); color:white; text-align:center; padding:10px;">
              <p>&copy; 2026 TicketTok. Todos los derechos reservados.</p>
        </footer>

    </body>
</html>
