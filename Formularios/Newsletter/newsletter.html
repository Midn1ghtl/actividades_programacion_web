<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Newsletter</title>
    <meta name="description" content="Formulario de suscripcion">
</head>
<body>
     <header style="background-color: #073879; color:#f8f8ff; text-align: center;">
        <h1>Newsletter</h1>
        <p>Suscribete para conocer mas sobre nuestras novedades</p>
    </header>
<main align="center">
  <img src="ICON-newsletter.png" alt="newsletter" width="300" height="260">
<form action="action_page.php" method="post">
  <label for="nombre">Nombre completo:</label><br>
  <input type="text" id="nombre" name="nombre" required><br>
  <label for="email">Correo electrónico:</label><br>
  <input type="email" id="email" name="email" required><br>
  <label for="tel">Telefono:</label><br>
  <input type="tel" id="tel" name="tel" required><br>
   Seleccione su pais: <select name="pais" required> 
<option value="1">Argentina</option>
<option value="2">España</option>
<option value="3">México</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
<option value="9">Cuba</option>
<option value="10">Bolivia</option>
<option value="11">Ecuador</option>
<option value="12">Uruguay</option>
</select>
<br>
<label for="fecha">Fecha de suscripción:</label><br>
  <input type="date" id="fecha" name="fecha" required><br>
  <p>¿Con qué frecuencia deseas recibir correos?</p>
<input type="radio" id="mensual" name="frecuencia" value="mensual" required>
<label for="mensual">Mensual</label>
<input type="radio" id="semanal" name="frecuencia" value="semanal" required>
<label for="semanal">Semanal</label>
<br><br>
  <input type="checkbox" id="acepto" name="acepto" required>
  <label for="acepto"> Acepta recibir notificaciones sobre todo lo nuevo de nuestra empresa.</label><br>
  <input type="submit" value="Suscribete">
</form>
<video width="320" height="240" controls>
  <source src="video.mp4" type="video/mp4">
  Tu navegador no soporta el elemento de video.
  </video>
   </main> 
</body>
</html>
