<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Registro Bancario</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

    </head>

    <body>
        <header style="background-color:royalblue; color:white; text-align:center; padding:10px;">
            <h1>Registro Bancario</h1>
        </header>
        <main align="center"><br>
            <section id="registro">
                <img src="img/banco.png" alt="Registro Bancario" width="200" height="200"><br><br>
                
                <form action="/action_registro.php" method="get" class="signup">
                    <label for="fname"> Nombre: </label><br>
                    <input type="text" id="fname" name="fname" required/><br>
                    <label for="lname"> Apellido: </label><br>
                    <input type="text" id="lname" name="lname" required/><br>
                    <label for="email"> Correo: </label><br>
                    <input type="email" id="email" name="email" required/><br>
                    <label for="numTel"> Teléfono: </label><br>
                    <input type="tel" id="numTel" name="numTel" required/><br>
                    <label for="fecha"> Fecha: </label><br>
                    <input type="date" id="fecha" name="fecha" required/><br><br>

                    <input type="submit" value="Submit"><br><br>

                    <video width="320" height="240" controls>
                        <source src="vid/Online Banking.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>


                </form>
            </section>


        </main>
        <footer>
           
        </footer>

    </body>
</html>
